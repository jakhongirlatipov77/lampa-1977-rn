# Конфигурация Nginx Reverse Proxy для Ubuntu Linux (/etc/nginx/sites-available/lamp-crm)

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Укажите ваш домен или IP-адрес сервера

    # Ограничение размера загружаемого файла (для восстановления бэкапов)
    client_max_body_size 50M;

    # Сжатие Gzip для быстрой загрузки на смартфонах
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
